# Blunux2 배포본 기본설정
# https://blunux.com/builder/ 에서 원하는 조합을 만들어 받을 수 있습니다.

[blunux]
version = "2.0"
name = "my-blunux-build"

# 언어 및 지역 설정
[locale]
language = ["ko_KR"]            # 한국어
timezone = "Asia/Seoul"
keyboard = ["kr", "us"]         # 키보드 레이아웃: 한국어, 영어

# 한글 입력기 설정
[input_method]
enabled = true                   # 한글 입력기 사용
engine = "kime"                  # kime, fcitx5, ibus 중 선택

# 커널 선택:
# type = "linux"        # 기본 커널 (기본값)
# type = "linux-lts"    # 장기 지원 커널 (안정적)
# type = "linux-zen"    # 성능 최적화 커널 (게임/데스크톱용)
[kernel]
type = "linux-zen"

# Blunux 자체 패키지 저장소
#
# calamares, kime, yay 는 ISO 에 구워져 들어가지만 어느 저장소에도 없어서
# 설치된 시스템에서는 "외래 패키지"로 잡히고 업데이트를 받지 못합니다
# (pacman -Qm 으로 확인). 이 저장소를 설정하면 그것들도 pacman -Syu 로
# 갱신됩니다.
[repo]
enabled = true
name = "blunux2"
url = "https://blunux.com/repo/$arch"

# 서명 검증 수준.
#   "Optional TrustAll"          서명 없이 신뢰 — 서버와 HTTPS 를 믿는다는 뜻
#   "Required DatabaseOptional"  GPG 서명 필수
# 나중에 서명으로 옮기려면 이 줄과 함께 repo-add --sign, makepkg --sign,
# 그리고 공개키를 ISO 키링에 미리 넣는 작업이 필요합니다.
siglevel = "Optional TrustAll"

# 서버 업로드 대상 (scripts/publish-repo 가 사용).
# 호스트·사용자·키는 ~/.ssh/config 의 별칭에서 옵니다 — 여기 적지 않습니다.
# 서버가 있는 사람만 쓰는 항목입니다. 없으면 저장소는 그냥 읽기 전용으로
# 동작하고, scripts/publish-repo 만 못 씁니다.

# 설치 옵션
[install]
# 부트로더 선택:
# bootloader = "grub"         # GRUB 부트로더 (기본값, BIOS + UEFI 지원)
# bootloader = "systemd-boot" # systemd-boot (UEFI 전용, 가벼움)
# bootloader = "nmbl"         # 부트로더 없음 - EFISTUB 직접 부팅 (UEFI 전용, 가장 빠름)
bootloader = "systemd-boot"

# 사용자 이름과 컴퓨터 이름은 여기 적지 않습니다.
#
# 적어 두면 설치 화면에 미리 채워집니다. 남에게 줄 이미지라면 만든 사람의
# 이름이 이미 들어가 있는 것보다 빈칸이 낫습니다. 비워 두면 설치 프로그램이
# 각자에게 물어봅니다.
#
# 본인용 이미지를 만든다면 별도 파일에 적고 그것으로 빌드하세요:
#   julia build.jl my-config.toml
#
# hostname = "nux"
# username = "blu"
#
# 비밀번호는 어디에도 적지 않습니다. 설치 프로그램이 직접 묻고, 여기 적어도
# 아무도 읽지 않습니다.

# 디스크 암호화 (true/false)
encryption = false

# 부팅 시 자동 로그인 (true/false)
autologin = true

# 디스크 설정
[disk]
# 스왑 공간 선택:
# swap = "none"       # 스왑 없음
# swap = "small"      # 작은 스왑 (RAM 크기의 절반, 가벼운 사용)
# swap = "suspend"    # 최대 절전용 스왑 (RAM과 같은 크기)
# swap = "file"       # 스왑 파일 (파티션 대신 파일 사용)
swap = "suspend"

# 데스크톱 환경
[packages.desktop]
kde = true                       # KDE Plasma 데스크톱

# 웹 브라우저
[packages.browser]
firefox = true                   # 파이어폭스
whale = true                     # 네이버 웨일
chrome = true                    # 구글 크롬
mullvad = true                   # Mullvad 브라우저

# 오피스
[packages.office]
libreoffice = true               # 리브레오피스
hoffice = true                   # 한글 오피스
texlive = true                   # LaTeX 문서 작성 도구

# 개발 도구
[packages.development]
vscode = true                    # VS Code 코드 편집기
sublime = true                   # Sublime Text 편집기
rust = true                      # Rust 프로그래밍 언어
julia = true                     # Julia 프로그래밍 언어
nodejs = true                    # Node.js 자바스크립트 런타임
github_cli = true                # GitHub CLI 도구

# 멀티미디어
[packages.multimedia]
obs = true                       # OBS 방송/녹화 프로그램
vlc = true                       # VLC 미디어 플레이어
freetv = true                    # FreeTuxTV TV 시청
ytdlp = true                     # yt-dlp 동영상 다운로더
freetube = true                  # FreeTube 유튜브 클라이언트

# 게임
[packages.gaming]
steam = true                     # 스팀 게임 플랫폼
unciv = true                     # UnCiv 문명 게임
snes9x = true                    # SNES 에뮬레이터

# 가상화
[packages.virtualization]
virtualbox = true                # VirtualBox 가상 머신
docker = true                    # Docker 컨테이너

# 커뮤니케이션
[packages.communication]
teams = true                     # Microsoft Teams
whatsapp = true                  # WhatsApp 메신저
onenote = true                   # OneNote 메모 앱

# 유틸리티
[packages.utility]
conky = true                     # Conky 시스템 모니터
vnc = true                       # VNC 원격 데스크톱
samba = true                     # Samba 파일 공유
bluetooth = true                 # 블루투스 지원

# App Installer 빌드 포함 여부 (ISO 빌드 시 적용)
[packages.ai]
agent = true                     # AI Agent를 ISO에 포함할지 여부

# AI Agent 런타임 설정
[ai_agent]
enabled = true                   # AI Agent 활성화 여부
provider = "claude"              # "claude" | "deepseek"
claude_mode = "oauth"            # "oauth" (Pro/Max 구독) | "api" (토큰 과금)
whatsapp_enabled = false         # WhatsApp 브리지 활성화 여부
language = "auto"                # "auto" (locale에서 감지) | "ko" | "en"
safe_mode = true                 # 안전 모드 (위험 명령 차단)

# 자동화 에이전트 설정 (세부 설정은 ~/.config/blunux-ai/automations.toml)
[ai_agent.automations]
health_check = true              # 일일 시스템 상태 보고 (매일 오전 9시)
security_updates = true          # 보안 업데이트 알림 (6시간마다)
disk_warning = true              # 디스크 공간 경고 (매일 자정)

# WhatsApp 브리지 설정 (whatsapp_enabled = true 일 때 적용)
[whatsapp]
# 허용된 전화번호 목록 (형식: "+821012345678"). 비어 있으면 아무도 허용되지 않으며,
# 브릿지 시작 시 표시되는 PAIR 코드를 보내 본인 번호를 등록합니다.
allowed_numbers = []
# 사용자당 분당 최대 메시지 수 (속도 제한)
max_messages_per_minute = 5
# true면 메시지가 "/ai " 접두사로 시작해야 명령으로 인식 (그룹 채팅 유용)
require_prefix = false
# 무활동 후 대화 초기화 시간 (초 단위, 기본값: 3600 = 1시간)
session_timeout = 3600
